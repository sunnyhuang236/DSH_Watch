<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSH Watch · M1 调试面板</title>
<style>
  :root { color-scheme: light dark; --bg:#0f172a; --panel:#111c33; --line:#26324d; --text:#e5edff; --muted:#93a4c3; --accent:#38bdf8; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; gap:16px; padding:14px 20px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:2; flex-wrap:wrap; }
  h1 { font-size:16px; margin:0; font-weight:650; }
  .badge { font-size:12px; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:2px 10px; }
  .muted { color:var(--muted); }
  .grow { flex:1; }
  main { display:grid; grid-template-columns:minmax(320px,420px) 1fr; gap:16px; padding:16px 20px; }
  @media (max-width:900px) { main { grid-template-columns:1fr; } }
  #tasks { display:flex; flex-direction:column; gap:8px; max-height:calc(100vh - 130px); overflow:auto; }
  .task { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px; cursor:pointer; }
  .task:hover { border-color:var(--accent); }
  .task.active { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
  .row { display:flex; align-items:center; gap:8px; }
  .title { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .summary { color:var(--muted); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .state { font-size:11px; border-radius:999px; padding:1px 8px; color:#fff; white-space:nowrap; }
  pre { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; overflow:auto; font-size:12px; max-height:38vh; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th, td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; position:sticky; top:0; background:var(--bg); }
  #events { max-height:42vh; overflow:auto; border:1px solid var(--line); border-radius:10px; }
  code { font-family:ui-monospace,Consolas,monospace; }
</style>
</head>
<body>
<header>
  <h1>DSH Watch · M1 调试面板</h1>
  <span class="badge">contract __CONTRACT__</span>
  <span class="badge">v__VERSION__</span>
  <span class="badge" id="health">连接中…</span>
  <span class="grow"></span>
  <span class="badge">只读 · 本机 · 2s 自动刷新</span>
</header>
<main>
  <section>
    <div class="muted" style="margin-bottom:8px">任务（按最近更新）</div>
    <div id="tasks"></div>
  </section>
  <section>
    <div class="row" style="margin-bottom:8px">
      <strong>任务快照</strong><span class="grow"></span><span class="muted" id="eventCount"></span>
    </div>
    <pre id="snapshot">选择左侧任务查看快照</pre>
    <div class="muted" style="margin:12px 0 8px">事件（最新 500 条）</div>
    <div id="events">
      <table>
        <thead><tr><th>seq</th><th>type</th><th>occurred_at</th><th>payload</th></tr></thead>
        <tbody id="eventsBody"></tbody>
      </table>
    </div>
  </section>
</main>
<script>
  const STATE_COLORS = { unknown:'#6b7280', running:'#2563eb', waiting_input:'#d97706', waiting_approval:'#b45309', succeeded:'#059669', failed:'#dc2626', cancelled:'#6b7280' };
  let selected = null;
  let tasks = [];
  const el = (id) => document.getElementById(id);
  const esc = (value) => String(value == null ? '' : value).replace(/[&<>"']/g, (ch) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));
  const fmtTime = (t) => { if (!t) return '-'; return new Date(t).toLocaleString(); };

  async function getJson(url) {
    const response = await fetch(url, { cache: 'no-store' });
    if (!response.ok) throw new Error(url + ' -> ' + response.status);
    return response.json();
  }

  function renderTasks() {
    const box = el('tasks');
    if (!tasks.length) {
      box.innerHTML = '<div class="muted">暂无任务。请确认插件或回放工具已启动，且 DSH 有会话事件。</div>';
      return;
    }
    box.innerHTML = tasks.map((task) => {
      const color = STATE_COLORS[task.state] || '#6b7280';
      const active = selected === task.task_id ? ' active' : '';
      return '<div class="task' + active + '" data-id="' + esc(task.task_id) + '">'
        + '<div class="row"><span class="state" style="background:' + color + '">' + esc(task.state) + '</span>'
        + '<span class="title">' + esc(task.title || task.task_id) + '</span></div>'
        + '<div class="summary">' + esc(task.summary || '') + '</div>'
        + '<div class="summary">run ' + esc(task.run_id || '-') + ' · 更新 ' + esc(fmtTime(task.updated_at))
        + (task.delegation_depth ? ' · 子代理深度 ' + task.delegation_depth : '') + '</div></div>';
    }).join('');
    box.querySelectorAll('.task').forEach((node) => node.addEventListener('click', () => {
      selected = node.dataset.id;
      renderTasks();
      loadDetail();
    }));
  }

  async function loadDetail() {
    if (!selected) {
      el('snapshot').textContent = '选择左侧任务查看快照';
      el('eventsBody').innerHTML = '';
      return;
    }
    const snapshot = await getJson('/v1/tasks/' + encodeURIComponent(selected));
    el('snapshot').textContent = JSON.stringify(snapshot, null, 2);
    const events = await getJson('/v1/tasks/' + encodeURIComponent(selected) + '/events?after_seq=-1&limit=500');
    el('eventsBody').innerHTML = events.events.map((event) =>
      '<tr><td>' + event.seq + '</td><td><code>' + esc(event.type) + '</code></td><td>' + esc(fmtTime(event.occurred_at)) + '</td>'
      + '<td><code>' + esc(JSON.stringify(event.payload)) + '</code></td></tr>').join('');
    el('eventCount').textContent = events.events.length + ' 条（最多 500）';
  }

  async function refresh() {
    try {
      const health = await getJson('/v1/health');
      el('health').textContent = 'ok · dsh-watch ' + health.version + ' · contract ' + health.contract
        + ' · tasks ' + health.stats.tasks + ' · events ' + health.stats.events + ' · uptime ' + health.uptime_s + 's';
      const listed = await getJson('/v1/tasks?limit=200');
      tasks = listed.tasks;
      if (selected && !tasks.some((task) => task.task_id === selected)) selected = null;
      if (!selected && tasks.length) selected = tasks[0].task_id;
      renderTasks();
      if (selected) await loadDetail();
    } catch (error) {
      el('health').textContent = '连接失败: ' + error.message;
    }
  }

  refresh();
  setInterval(refresh, 2000);
</script>
</body>
</html>
