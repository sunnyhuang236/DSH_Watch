<body>
  <h1>DSH Watch · M1 调试面板</h1>
  <p>面板由插件或回放工具在 <code>http://127.0.0.1:7317/</code> 提供。</p>
  <p>若尚未启动：</p>
  <pre><code>cd dsh-mobile-watch
node tools/replay-logs.mjs     # 回放历史会话
node tools/watch-logs.mjs      # 近实时 tail 正在运行的会话</code></pre>
  <p>然后打开 <a href="http://127.0.0.1:7317/">http://127.0.0.1:7317/</a></p>
</body>
