name: DSHWatch
options:
  bundleIdPrefix: com.dshwatch
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  DSHWatch:
    type: application
    platform: iOS
    sources:
      - path: DSHWatch
    info:
      path: DSHWatch/Info.plist
      properties:
        CFBundleDisplayName: DSH Watch
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "用于连接同一 Wi-Fi 下的 DSH 网关，读取任务状态。"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dshwatch.app
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
